name: Checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify source checksums
        run: sha256sum -c SOURCE_MANIFEST.sha256
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked Python dependencies in a clean environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --no-cache-dir -r backend/requirements-lock.txt
          .venv/bin/python -m pip check
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Run backend, frontend, and build checks
        run: bash scripts/check.sh
      - name: Check production pages and isolated API over HTTP
        run: python scripts/http-smoke.py
